<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo circular dorado -->
  <circle cx="50" cy="50" r="48" fill="#C8A45C"/>
  <circle cx="50" cy="50" r="44" fill="#1a1008"/>
  <circle cx="50" cy="50" r="40" fill="#C8A45C"/>
  <circle cx="50" cy="50" r="36" fill="#c49840"/>

  <!-- Cruz cardinal -->
  <line x1="50" y1="16" x2="50" y2="84" stroke="#1a1008" stroke-width="5" stroke-linecap="round"/>
  <line x1="16" y1="50" x2="84" y2="50" stroke="#1a1008" stroke-width="5" stroke-linecap="round"/>

  <!-- Círculo central -->
  <circle cx="50" cy="50" r="10" fill="#1a1008"/>
  <circle cx="50" cy="50" r="6" fill="#C8A45C"/>
  <circle cx="50" cy="50" r="2.5" fill="#1a1008"/>

  <!-- Sol — cuadrante superior izquierdo -->
  <circle cx="32" cy="32" r="7" fill="none" stroke="#1a1008" stroke-width="2.5"/>
  <line x1="32" y1="22" x2="32" y2="42" stroke="#1a1008" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="32" x2="42" y2="32" stroke="#1a1008" stroke-width="2" stroke-linecap="round"/>

  <!-- Luna — cuadrante superior derecho -->
  <path d="M62,22 Q76,32 62,42 Q78,38 78,32 Q78,26 62,22Z" fill="#1a1008"/>

  <!-- Semilla — cuadrante inferior izquierdo -->
  <ellipse cx="32" cy="68" rx="6" ry="8" fill="#1a1008"/>

  <!-- Espiral — cuadrante inferior derecho -->
  <path d="M68,62 Q76,68 70,74 Q64,78 60,72 Q58,66 64,63 Q70,61 72,67" fill="none" stroke="#1a1008" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Borde decorativo punteado -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#1a1008" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#8B6914" stroke-width="2"/>
</svg>
